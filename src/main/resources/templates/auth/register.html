<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registrarse | CuidaPet</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><main class="card">
<p class="brand">CuidaPet</p><h1>Crear cuenta</h1><p>Tu cuenta se registrará como propietario de mascotas.</p>
<p class="message error" role="alert" th:if="${error}" th:text="${error}"></p>
<form method="post" th:action="@{/register}" th:object="${registrationForm}">
<label for="email">Correo electrónico</label><input id="email" th:field="*{email}" type="email" maxlength="160" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" aria-describedby="password-help" required>
<small id="password-help">Mínimo 8 caracteres. Máximo 72 bytes; las tildes y emojis pueden ocupar más de un byte.</small>
<button type="submit">Registrarme</button>
</form><p><a th:href="@{/login}">Volver a iniciar sesión</a></p>
</main></body></html>
