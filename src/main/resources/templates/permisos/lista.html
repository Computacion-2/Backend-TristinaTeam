<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Permisos | CuidaPet</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><main class="card wide">
<p class="brand">CuidaPet</p><h1>Permisos</h1>
<nav><a th:href="@{/}">Inicio</a> · <a th:href="@{/roles}">Roles</a> · <a th:href="@{/permisos/nuevo}">Crear permiso</a></nav>
<p class="message" role="status" th:if="${message}" th:text="${message}"></p>
<p class="message error" role="alert" th:if="${error}" th:text="${error}"></p>
<p th:if="${#lists.isEmpty(permissions)}">Todavía no hay permisos.</p>
<div class="table-scroll" th:unless="${#lists.isEmpty(permissions)}"><table>
<caption>El código es la autoridad que evalúa Spring Security y no se puede modificar. Los permisos del sistema no se pueden eliminar.</caption>
<thead><tr><th scope="col">ID</th><th scope="col">Código</th><th scope="col">Nombre</th><th scope="col">Descripción</th><th scope="col">Acciones</th></tr></thead>
<tbody><tr th:each="permission : ${permissions}"><td th:text="${permission.id}"></td><td><code th:text="${permission.permissionCode}"></code></td>
<td th:text="${permission.permissionName}"></td><td th:text="${permission.description}"></td>
<td><a th:href="@{/permisos/{id}/editar(id=${permission.id})}">Editar</a>
<form class="inline-form" method="post" th:unless="${#sets.contains(systemPermissions, permission.permissionCode)}" th:action="@{/permisos/{id}/eliminar(id=${permission.id})}"><button class="danger" type="submit">Eliminar</button></form>
<span class="tag" th:if="${#sets.contains(systemPermissions, permission.permissionCode)}">Sistema</span></td>
</tr></tbody></table></div>
</main></body></html>
